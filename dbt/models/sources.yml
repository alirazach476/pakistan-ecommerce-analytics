version: 2

sources:
  - name: raw
    description: Landing-zone tables loaded by the Python ETL pipeline (synthetic Pakistani e-commerce data).
    schema: raw
    tables:
      - name: locations
        columns:
          - name: location_id
            tests: [unique, not_null]
      - name: categories
        columns:
          - name: category_id
            tests: [unique, not_null]
      - name: sellers
        columns:
          - name: seller_id
            tests: [unique, not_null]
      - name: customers
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: products
        columns:
          - name: product_id
            tests: [unique, not_null]
      - name: orders
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: customer_id
            tests:
              - relationships:
                  to: source('raw', 'customers')
                  field: customer_id
      - name: order_items
        columns:
          - name: order_item_id
            tests: [unique, not_null]
      - name: payments
        columns:
          - name: payment_id
            tests: [unique, not_null]
      - name: shipments
        columns:
          - name: shipment_id
            tests: [unique, not_null]
      - name: returns
        columns:
          - name: return_id
            tests: [unique, not_null]
